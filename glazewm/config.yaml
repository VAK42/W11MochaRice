general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: true
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: true
gaps:
  scale_with_dpi: true
  inner_gap: '2px'
  outer_gap:
    top: '2px'
    right: '2px'
    bottom: '2px'
    left: '2px'
window_effects:
  focused_window:
    border:
      enabled: true
      color: '#94e2d5'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
    transparency:
      enabled: true
      opacity: '95%'
  other_windows:
    border:
      enabled: true
      color: '#b4befe'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
    transparency:
      enabled: true
      opacity: '90%'
window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false
workspaces:
  - name: '一'
  - name: '二'
  - name: '三'
  - name: '四'
  - name: '五'
  - name: '六'
  - name: '七'
  - name: '八'
  - name: '九'
window_rules:
  - commands: ['ignore']
    match:
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }
binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']
keybindings:
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']
  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']
  - commands: ['resize --width -2%']
    bindings: ['alt+u']
  - commands: ['resize --width +2%']
    bindings: ['alt+p']
  - commands: ['resize --height +2%']
    bindings: ['alt+o']
  - commands: ['resize --height -2%']
    bindings: ['alt+i']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+v']
  - commands: ['wm-cycle-focus']
    bindings: ['alt+space']
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']
  - commands: ['toggle-tiling']
    bindings: ['alt+t']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']
  - commands: ['toggle-minimized']
    bindings: ['alt+m']
  - commands: ['close']
    bindings: ['alt+shift+q']
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']
  - commands: ['shell-exec wt.exe']
    bindings: ['alt+enter']
  - commands: ['focus --next-active-workspace']
    bindings: ['alt+s']
  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+a']
  - commands: ['focus --recent-workspace']
    bindings: ['alt+d']
  - commands: ['focus --workspace 一']
    bindings: ['alt+1']
  - commands: ['focus --workspace 二']
    bindings: ['alt+2']
  - commands: ['focus --workspace 三']
    bindings: ['alt+3']
  - commands: ['focus --workspace 四']
    bindings: ['alt+4']
  - commands: ['focus --workspace 五']
    bindings: ['alt+5']
  - commands: ['focus --workspace 六']
    bindings: ['alt+6']
  - commands: ['focus --workspace 七']
    bindings: ['alt+7']
  - commands: ['focus --workspace 八']
    bindings: ['alt+8']
  - commands: ['focus --workspace 九']
    bindings: ['alt+9']
  - commands: ['move-workspace --direction left']
    bindings: ['alt+shift+a']
  - commands: ['move-workspace --direction right']
    bindings: ['alt+shift+f']
  - commands: ['move-workspace --direction up']
    bindings: ['alt+shift+d']
  - commands: ['move-workspace --direction down']
    bindings: ['alt+shift+s']
  - commands: ['move --workspace 一', 'focus --workspace 一']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 二', 'focus --workspace 二']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 三', 'focus --workspace 三']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 四', 'focus --workspace 四']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 五', 'focus --workspace 五']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 六', 'focus --workspace 六']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 七', 'focus --workspace 七']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 八', 'focus --workspace 八']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 九', 'focus --workspace 九']
    bindings: ['alt+shift+9']
  - commands: ['shell-exec powershell -NoProfile -Command "& ''C:\Program Files\Mozilla Firefox\private_browsing.exe''"']
    bindings: ['alt+b']
  - commands: ['shell-exec powershell -NoProfile -Command "& ''C:\Users\VAK\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe''"']
    bindings: ['alt+g']
  - commands: ['shell-exec powershell.exe -NoProfile -Command "Start-Process powershell.exe -Verb RunAs -ArgumentList ''-NoProfile -ExecutionPolicy Bypass -File C:\Users\VAK.ps1''"']
    bindings: ['alt+x']